name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Run isolated backend suite
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  e2e:
    name: Isolated live E2E
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KPD_DATABASE_URL: sqlite:////tmp/kpd-ci-e2e.db
      KPD_CORS_ORIGINS: http://127.0.0.1:5173
      KPD_E2E_API_TARGET: http://127.0.0.1:8010
      KPD_E2E_BASE_URL: http://127.0.0.1:5173
      KPD_E2E_PORT: "5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Migrate and seed isolated SQLite
        run: |
          alembic upgrade head
          python -m app.seed
      - name: Run browser scenarios against isolated seed
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 >"$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8010/api/v1/health/ready >/dev/null; then
              break
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8010/api/v1/health/ready >/dev/null || {
            cat "$RUNNER_TEMP/backend.log"
            exit 1
          }
          cd frontend
          npm run test:e2e
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/backend.log
